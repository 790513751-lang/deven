<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="选择苹果或安卓手机，完成网络准备、Telegram 安装并进入频道。">
  <meta name="referrer" content="no-referrer">
  <title>TG 上手指南 · 一步一步，轻松开始</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='14' fill='%232568ed'/%3E%3Cpath d='m11 23 27-11-7 26-9-9-11-6Zm11 6 9-10' fill='none' stroke='white' stroke-width='3' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script src="./config.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#guide">跳到操作步骤</a>
  <header class="site-header">
    <a class="brand" href="#iphone/1" aria-label="TG 上手指南首页">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3 11 18-7-5 17-5-6-8-4Zm8 4 6-7"/></svg></span>
      <span id="brand-name">TG 上手指南</span>
    </a>
    <button class="help-button" type="button" data-help><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/></svg>需要帮助</button>
  </header>
  <main class="page">
    <section class="intro" aria-labelledby="page-title">
      <div class="eyebrow">TELEGRAM · 手机入门</div>
      <h1 id="page-title">跟着步骤，轻松开始。</h1>
      <p>选好你的手机，完成网络准备、安装 Telegram 并进入频道。</p>
      <div class="device-picker" role="group" aria-label="选择你的手机">
        <button class="device-button" type="button" data-device="iphone" aria-pressed="true">
          <svg class="device-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 5h4m-4 14h4"/></svg>
          <span><strong>苹果手机</strong><small>iPhone / iPad</small></span><span class="device-selected" aria-hidden="true"></span>
        </button>
        <button class="device-button" type="button" data-device="android" aria-pressed="false">
          <svg class="device-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 15a7 7 0 0 1 14 0v4H5v-4Zm2-8L5 4m12 3 2-3M9 12v1m6-1v1"/></svg>
          <span><strong>安卓手机</strong><small>华为 / 小米 / OPPO 等</small></span><span class="device-selected" aria-hidden="true"></span>
        </button>
      </div>
      <div id="browser-tip" class="browser-tip">
        <span class="browser-tip-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 9h18M8 3c2.7 2.9 2.7 14.1 0 18m8-18c-2.7 2.9-2.7 14.1 0 18"/></svg></span>
        <p id="browser-tip-text">请使用手机系统浏览器打开本页。</p>
        <button type="button" data-copy-page>复制本页网址</button>
      </div>
    </section>
    <div class="guide-layout">
      <aside class="journey">
        <div class="journey-heading"><span>你的操作步骤</span><span id="progress-label">1 / 4</span></div>
        <nav id="step-nav" aria-label="流程步骤"></nav>
        <div class="preparation"><span class="small-caption">开始前准备好</span><p>一部手机<br>一个自己能接收验证码的手机号</p><div class="return-note">切去其他 App 后，<br>回来就能继续这一步。</div></div>
      </aside>
      <section id="guide" class="guide-card" aria-labelledby="step-title" tabindex="-1">
        <div id="step-content"></div>
        <div class="step-actions"><button id="previous" class="button button-back" type="button">上一步</button><button id="next" class="button button-primary" type="button">下一步 <span aria-hidden="true">→</span></button></div>
      </section>
    </div>
    <div class="bottom-note"><span>安装或注册卡住了？</span><button type="button" data-help>查看常见问题 <span aria-hidden="true">↗</span></button></div>
    <footer><span>按你的节奏完成，不用着急。</span><span>独立使用指南 · 非 Telegram 官方网站</span></footer>
  </main>
  <dialog id="help-dialog" aria-labelledby="help-title">
    <div class="dialog-top"><div><span class="eyebrow">遇到问题</span><h2 id="help-title">先看看这里</h2></div><button id="close-help" class="icon-button" type="button" aria-label="关闭帮助">×</button></div>
    <div id="help-content"></div>
    <div id="contact-action"></div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><div class="noscript">请开启浏览器的 JavaScript，以查看分步教程。Telegram 官方下载入口：<a href="https://telegram.org/apps">telegram.org/apps</a>。</div></noscript>
</body>
</html>
